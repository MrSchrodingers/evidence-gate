# GATE EXTERNO. Esta e a unica fronteira desta arquitetura que o ator governado nao sobrepoe.
#
# O hook Stop nao serve para isso, por quatro razoes verificadas: stop_hook_active libera a
# parada seguinte; o runtime sobrepoe o hook apos N bloqueios; N vive em variavel dentro do
# settings.json que o proprio ator escreve; e Stop nao dispara em interrupcao nem em erro de API.
# Ver docs/adr/0022.
#
# Para que este workflow seja enforcement e nao decoracao, e preciso configurar no repositorio:
#   Settings > Rules > required status check = "verify-pr"
#   proibir bypass para o ator, e exigir o check sobre o SHA exato.
# Sem isso ele e feedback, como pre-commit - que `git commit --no-verify` ignora (medido).
#
# ESTE E O CONTEXTO EXIGIDO. O gemeo `verify-push.yml` roda a MESMA verificacao em `push` e NAO
# deve ser exigido pelo ruleset.
name: verify-pr
on:
  pull_request:
  merge_group:
concurrency:
  group: verify-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  # DEFEITO PROPRIO, 2026-08-12: aqui foi declarado `administration: read`, que NAO EXISTE
  # como escopo de permissions do GITHUB_TOKEN. Conferido na fonte primaria depois de quebrar:
  # a lista valida e actions, attestations, checks, contents, deployments, discussions,
  # id-token, issues, packages, pages, pull-requests, security-events, statuses. Chave invalida
  # invalida o WORKFLOW INTEIRO - a execucao morreu sem nenhum job, sem log e sem anotacao, o
  # que e um modo de falha pior que um passo vermelho. Instrucao nao executada e hipotese.
jobs:
  verify-pr:
    name: verify-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinado: tag e mutavel
        with: { fetch-depth: 0 }
      - name: ferramentas dos adaptadores
        timeout-minutes: 12
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # PIP COM HASH DO FECHO TRANSITIVO. Antes desta linha havia sete pacotes com `==`
          # inline: isso pinava a versao de TOPO e deixava numpy, python-dateutil, pytz, six,
          # tzdata e et-xmlfile livres e sem hash nenhum. `==` responde 'qual versao', nunca
          # 'qual artefato'. `--require-hashes` exige hash para TODO pacote do fecho e recusa
          # qualquer arquivo cujo sha256 nao case. Ver install/requirements-ci.txt para como o
          # arquivo foi gerado e validado, e install/regen-requirements.sh para regerar.
          python3 -m pip install --quiet --require-hashes -r install/requirements-ci.txt
          # EXCECAO DECLARADA - apt NAO pinado: `ubuntu-24.04` fixa a familia da imagem, nao
          # o snapshot do repositorio apt. Fixar versoes apt contra um runner hospedado quebraria
          # quando a imagem girasse. Isto compra auditabilidade, NAO hermeticidade; as versoes
          # efetivamente observadas sao impressas abaixo. Hermeticidade exige imagem por digest
          # ou repositorio apt snapshotado e permanece fora desta garantia.
          missing=()
          command -v pdftotext >/dev/null || missing+=(poppler-utils)
          command -v pandoc    >/dev/null || missing+=(pandoc)
          # ffmpeg entra na onda 10: sem ele o grupo D8 de tests/unit/document-tools.sh mede o
          # ramo da LACUNA DECLARADA do adaptador de midia, nao o ramo produtivo. Uma suite que
          # so exercita o caminho de indisponibilidade nao verifica o caminho que se usa.
          command -v ffmpeg    >/dev/null || missing+=(ffmpeg)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "instalando: ${missing[*]}"
            # ONDA 12, TRES NIVEIS DE TIMEOUT QUE PRECISAM SER COERENTES ENTRE SI.
            # Historico medido, porque a primeira correcao daqui estava errada:
            #   1. `timeout 180` no update reprovou TRES VEZES em 180.0s exatos (runs
            #      32087883039, 32087832119; exit 124). Relogio batendo com o limite e nao com
            #      um pico e assinatura de orcamento, nao de rede.
            #   2. Subi o interno para 420/600 SEM olhar o `timeout-minutes: 6` do passo: 1020s
            #      de orcamento interno sob um teto externo de 360s. O interno virou inalcancavel
            #      e o passo passou a morrer com "has timed out after 6 minutes" - erro
            #      DIFERENTE, que so apareceu porque a primeira correcao mudou o ponto de morte.
            # Ordem correta: interno < passo < job.
            #      interno 300 + 400 = 700s  <  passo 720s  <  job 2700s
            # O job tambem subiu, por medicao independente: `verify-pr` fechou em 29m58s contra
            # teto de 30min. Um job que passa por 2 segundos nao esta passando, esta sorteando.
            #
            # exit 124 nao e suite vermelha: mata o passo ANTES de ele avaliar o codigo. Ler isso
            # como "o verificado esta errado" e a confusao que este repositorio persegue - e a
            # assimetria pratica e que reexecutar corrige um pico e mascara um limite.
            # INSTALL PRIMEIRO, UPDATE SO SE PRECISAR. Terceira iteracao aqui, e as duas
            # anteriores foram numero: 180->420 (que ficou acima do teto do passo) e 420->300 com
            # o passo alargado. O `update` reprovou em 180.0s, depois em 300.0s - subir o limite
            # persegue uma distribuicao de rede, nao uma causa. Quando `verify-pr` e `verify-push`
            # rodam o MESMO passo e um passa tres vezes enquanto o outro falha quatro, o que varia
            # e o mirror sorteado, nao o codigo.
            # A imagem do runner costuma trazer listas apt utilizaveis; quando traz, o `update`
            # inteiro e custo puro. Entao: tenta instalar, e so paga a operacao lenta se a
            # primeira tentativa falhar. O caminho comum deixa de depender dela.
            #
            # ONDA 15 - MEDIDO EM DUAS EXECUCOES, e a segunda refuta a leitura da primeira:
            #   run 32192196023   verify-pr 21m50s, apt 53s (4%)
            #   run 32290684256   `install` bateu o timeout 300; o `update` seguinte estourou o
            #                     teto de 12min do passo e MATOU o job
            # O ramo `else` abaixo NUNCA executa: ubuntu-24.04 nao traz nenhuma das tres.
            # O custo do apt e BIMODAL, nao ~4%: uma amostra dizia que containerizar valia so
            # por hermeticidade, e a amostra seguinte mostrou o passo derrubando o build. A
            # imagem OCI pinada por digest e o fix nos dois eixos, e fica declarada como
            # BLOQUEIO conhecido. Subir o limite NAO entra - ver as duas tentativas acima. Ver
            # ADR 0035.
            if ! sudo timeout 300 apt-get install -y -qq "${missing[@]}"; then
              echo "install direto falhou (listas apt provavelmente ausentes) - rodando update"
              sudo timeout 300 apt-get -o Acquire::Retries=3 update -qq
              sudo timeout 400 apt-get -o Acquire::Retries=3 install -y -qq "${missing[@]}"
            fi
          else
            echo "poppler-utils, pandoc e ffmpeg ja presentes na imagem; apt nao foi acionado"
          fi
          echo "versoes de sistema observadas nesta execucao:"
          pdftotext -v 2>&1 | head -1; pandoc --version | head -1; ffmpeg -version | head -1
          ruff --version && node --version && jq --version
      - name: sintaxe de todo hook
        run: |
          rc=0
          for f in control/hooks/*.sh execution/hooks/*.sh evidence/hooks/*.sh install/*.sh tests/*/*.sh; do
            bash -n "$f" || { echo "QUEBRADO: $f"; rc=1; }
          done
          exit $rc
      - name: adaptadores sao JSON valido e declaram efeitos
        run: |
          rc=0
          for a in execution/adapters/code/*.json; do
            jq -e . "$a" >/dev/null || { echo "JSON invalido: $a"; rc=1; }
            jq -e '.exec.command and .exec.args and .declared_effects and .rationale' "$a" >/dev/null \
              || { echo "contrato incompleto: $a"; rc=1; }
          done
          for a in execution/adapters/documents/*.json; do
            jq -e . "$a" >/dev/null || { echo "JSON invalido: $a"; rc=1; }
          done
          exit $rc
      - name: manifesto reflete a arvore
        run: |
          bash install/manifest.sh install/manifest.check >/dev/null
          diff -u install/manifest.lock install/manifest.check \
            || { echo "manifest.lock desatualizado - rode install/manifest.sh e commite"; exit 1; }
      - name: orquestracao multirruntime e projecoes
        run: bash tests/unit/runtime-ports.sh
      - name: fronteira externa (o contexto do required check e unico)
        run: bash tests/unit/fronteira-externa.sh
      - name: cadeia de suprimentos
        run: bash tests/unit/supply-chain.sh
      - name: executor documental
        run: bash tests/unit/document-tools.sh
      - name: reprodutibilidade (metamorfico)
        run: bash tests/unit/reprodutibilidade.sh
      - name: raiz de confianca (instalador managed, prefixo de ensaio)
        run: bash tests/unit/managed.sh
      - name: propriedades (detectores invariantes a formatacao)
        run: bash tests/unit/propriedades.sh
      - name: claim ledger (evidencia citada existe)
        run: bash tests/unit/claims.sh
      - name: concorrencia (lock das suites)
        run: bash tests/unit/concorrencia.sh
      - name: status gerado reflete a execucao
        run: bash scripts/status.sh --check
      - name: conformidade de dois escopos (usuario + managed)
        run: bash tests/unit/conformidade-managed.sh
      - name: arnes de mutacao (interrupcao nao deixa mutante no disco)
        run: bash tests/unit/arnes-de-mutacao.sh
      - name: escalonamento de paralelismo (conjunto de escrita)
        run: bash tests/unit/schedule.sh
      - name: fronteira viva (Applies(P,r) medido no servidor)
        run: bash tests/unit/fronteira-viva.sh
      - name: camada de literatura (qualidade e aplicabilidade da evidencia)
        run: bash tests/unit/literatura.sh
      - name: conformidade de capability declarada (projecoes do repo)
        run: python3 evidence/runtime-probes/declared-capabilities.py --repo-only
      - name: conformidade de capability declarada (suite)
        run: bash tests/unit/capabilities.sh
      - name: regressao do gate
        run: bash tests/unit/regressao-gate.sh
      # ONDA 25c. `docs/status.generated.md` publicava `lint-delta (auto) | ? | NAO executado no
      # CI` e o mesmo para `verify-gate-delta` - as quatro suites do ramo que a onda inteira
      # construiu rodavam SO na estacao do autor, entao `verify-pr` verde nao falava sobre elas.
      # Mesma classe do achado F3 da onda 15, que ja tinha decidido a saida: executar, nao
      # ajustar o rotulo. Custo MEDIDO antes de decidir, nesta maquina: 6,91 s + 12,02 s +
      # 93,65 s + 103,83 s = 3min37 num verify-pr de ~25min. As duas unitarias dependem de `ruff`
      # no PATH e declaram NAO VERIFICADO (exit 2) se ele faltar - o passo de versoes acima ja
      # exige `ruff --version`, entao ausencia vira falha visivel e nao verde vazio.
      - name: nucleo que julga o delta
        run: bash tests/unit/lint-delta.sh
      - name: delta ponta a ponta (pelo hook)
        run: bash tests/unit/delta-e2e.sh
      - name: validacao por mutacao (nucleo do delta)
        run: bash tests/mutation/lint-delta.sh
      - name: validacao por mutacao (executor do delta)
        run: bash tests/mutation/verify-gate-delta.sh
      - name: validacao por mutacao (gate)
        run: bash tests/mutation/run.sh
      - name: validacao por mutacao (contrato de subagente)
        run: bash tests/mutation/contrato.sh
      - name: validacao por mutacao (instalador)
        run: bash tests/mutation/install.sh
      - name: validacao por mutacao (fronteira externa)
        run: bash tests/mutation/fronteira.sh
      - name: validacao por mutacao (conformidade de dois escopos)
        run: bash tests/mutation/conformidade.sh
      - name: validacao por mutacao (escalonamento)
        run: bash tests/mutation/schedule.sh
      - name: validacao por mutacao (fronteira viva)
        run: bash tests/mutation/fronteira-viva.sh
      # ONDA 15, achado do portao final (F3). `docs/status.generated.md` publicava "passo
      # dedicado no CI" para TODO arnes de `tests/mutation/`, e para estes dois nao havia passo
      # algum: 43 mutantes rodavam so na estacao do autor enquanto o artefato afirmava o
      # contrario. Custo medido antes de decidir - 37s e 42s -, entao a saida certa e executar,
      # nao ajustar o rotulo.
      - name: validacao por mutacao (conformidade de capability)
        run: bash tests/mutation/capability-conformance.sh
      - name: validacao por mutacao (hooks de guarda)
        run: bash tests/mutation/hooks-de-guarda.sh
      - name: validacao por mutacao (completude do corpus)
        run: bash tests/mutation/corpus-completude.sh
      - name: validacao por mutacao (camada de literatura)
        run: bash tests/mutation/literatura.sh
      - name: validacao por mutacao (claim ledger)
        run: bash tests/mutation/claims.sh
      - name: validacao por mutacao (capability declarada)
        run: bash tests/mutation/capabilities.sh
      # ONDA 10. A CI conferia os adaptadores documentais so com `jq -e .` - sintaxe valida. Foi
      # exatamente por ali que `media.json` atravessou nove ondas declarando `pipeline` onde o
      # executor exige `plans`, e o caminho sancionado para imagem ficou inutilizavel. Sintaxe
      # valida nao e conformidade de contrato.
      - name: conformidade de schema dos adaptadores documentais
        run: python3 evidence/validate-adapters.py
      # PASSO DEDICADO, e nao opcional: scripts/status.sh varre tests/mutation/*.sh e publica
      # "passo dedicado no CI" para cada arnes que encontra. Sem este passo aquela linha seria
      # uma afirmacao falsa no documento de estado.
      - name: validacao por mutacao (conformidade de adaptador)
        run: bash tests/mutation/adaptadores.sh
      - name: cobertura de decisao (mecanismo, evidence/cobertura.sh)
        run: bash tests/unit/cobertura.sh
      # UBUNTU 24.04 RESTRINGE USER NAMESPACE NAO PRIVILEGIADO POR APPARMOR. Tres dos doze
      # mutantes de fable-guard exercitam POSSE DE ROOT sobre o sentinela usando
      # `unshare --map-root-user --user`, que mapeia o UID real para 0 num namespace - o
      # `stat -c %U` reporta root de verdade, nao mock, e nao exige sudo. Sem essa capacidade o
      # arnes nao consegue MEDIR essas tres garantias. Habilitar e melhor que degradar o teste:
      # a alternativa seria o arnes declarar NAO MEDIDO em CI para sempre, e uma garantia de
      # autorizacao permanentemente nao medida no portao e o defeito que este repositorio
      # existe para impedir. O passo imprime o estado do sysctl ANTES e DEPOIS - se a
      # habilitacao falhar, isso fica visivel no log em vez de virar um vermelho mudo.
      - name: capacidade de user namespace (pre-requisito dos mutantes de posse-root)
        run: |
          echo "antes: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 'sysctl ausente')"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          echo "depois: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 'sysctl ausente')"
          if unshare --map-root-user --user true 2>/dev/null; then echo "unshare: DISPONIVEL"
          else echo "unshare: INDISPONIVEL - os 3 mutantes de posse-root sairao NAO MEDIDO"; fi
      - name: validacao por mutacao (guarda dura do Fable - superficie de autorizacao)
        run: bash tests/mutation/fable-guard.sh
      - name: validacao por mutacao (cobertura de decisao)
        run: bash tests/mutation/cobertura.sh
      - name: cobertura de decisao (piso por arquivo, evidence/probes|validate-*|schedule.py)
        run: bash evidence/cobertura.sh --check
      - name: suite legada
        run: bash tests/unit/run.sh
      # FIM DO JOB ESTATICO. O verde de `verify-pr` significa, a partir da onda 10, EXATAMENTE
      # "as verificacoes deterministicas passaram". Nada alem disso. A fronteira viva saiu daqui.

  # ---------------------------------------------------------------------------------------------
  # POR QUE A FRONTEIRA VIVA VIROU UM JOB SEPARADO, e o defeito que forcou a separacao
  #
  # Enquanto ela era um PASSO de `verify-pr`, a ausencia de RULESET_READ_TOKEN produzia `exit 0`
  # e o job inteiro ficava verde com a garantia critica NAO MEDIDA. Duas auditorias externas
  # independentes apontaram isso em 2026-08-12, por caminhos diferentes.
  #
  # A medicao que fecha o caso e pior do que ambas supuseram. No log da execucao 31641449160
  # (verify-pr do PR #15, conclusao success) o ambiente do passo aparece como `GH_TOKEN:` VAZIO,
  # e a saida e "NAO VERIFICADO: RULESET_READ_TOKEN ausente". O segredo nunca foi configurado:
  # o probe foi instalado na onda 9 e NUNCA mediu nada contra a API real. O ObservableVerifier
  # existia, era testado por 188 assercoes e 30 mutantes, e nunca observou.
  #
  #     CI_SUCCESS   =/=>   para toda garantia critica g:  Verified(g)
  #
  # Um job por termo torna o quantificador visivel: `verify-pr` responde pelo lado estatico,
  # `verify-live-policy` responde pelo termo externo, e nenhum dos dois cobre o outro.
  #
  # DIFERENCA DE CONTRATO EM RELACAO AO PASSO ANTIGO: sem o segredo isto agora sai 2, nao 0.
  # NOT_VERIFIED nao pode compartilhar a conclusao externa de VERIFIED - o GitHub so tem
  # success/failure para um passo de `run:`, entao o unico mapeamento honesto de NOT_VERIFIED e
  # nao-verde. O custo declarado: em PR vindo de fork o segredo e legitimamente indisponivel e
  # este job ficara vermelho; este repositorio tem 0 forks (medido em 2026-08-12), e quando isso
  # mudar a condicao correta e `github.event.pull_request.head.repo.fork`, nao afrouxar o portao.
  #
  # `verify-live-policy` NAO esta na lista de required status checks do ruleset - hoje ele
  # ficaria permanentemente vermelho e bloquearia todo merge, porque o segredo nao existe.
  # Adiciona-lo e a etapa seguinte, DEPOIS de o segredo existir. Ate la ele e sinal visivel,
  # nao portao - e essa distincao esta escrita aqui para nao ser confundida com aprovacao.
  # ---------------------------------------------------------------------------------------------
  verify-live-policy:
    name: verify-live-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinado: tag e mutavel
      # FRONTEIRA VIVA - mede Applies(P,r) e Bypass(a,P) contra o endpoint AUTORITATIVO do
      # GitHub, nao contra os arquivos de workflow deste repositorio.
      #
      # EXIGE SEGREDO, POR MEDICAO. `bypass_actors` responde ao existencial "existe algum ator
      # que contorna?"; `current_user_can_bypass` responde so "ESTE ator contorna?". A API omite
      # o primeiro para quem nao tem write no ruleset - medido contra a API viva em 2026-08-12
      # (github/docs ruleset 19633356: campo ausente). Tratar a ausencia como aprovacao INVERTIA
      # a direcao: reduzir o privilegio do observador deixava o portao verde sobre o mesmo ruleset.
      #
      # A DECISAO ESTA EM BASH, NAO EM `if:` DE PASSO, E ISSO E DELIBERADO. A tentativa anterior
      # usou `if: ${{ secrets.X == '' }}` e invalidou o workflow INTEIRO - execucao 31626367844
      # saiu failure com ZERO jobs, sem log e sem anotacao. Segunda vez nesta serie que uma
      # expressao de configuracao foi publicada sem nunca ter sido executada; a primeira foi um
      # escopo de `permissions` inexistente. Em bash a condicao e testavel antes de subir.
      - name: fronteira viva CONTRA A API REAL do GitHub - Applies(P,r) e Bypass(a,P)
        env:
          GH_TOKEN: ${{ secrets.RULESET_READ_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "NAO VERIFICADO: RULESET_READ_TOKEN ausente."
            echo "  O termo existencial de Bypass(a,P) NAO foi medido nesta execucao."
            echo "  GITHUB_TOKEN nao recebe 'bypass_actors' da API - medido, nao suposto."
            echo "  LACUNA DECLARADA, nao aprovacao. Ver evidence/claims/C-018.yaml."
            echo "::error title=fronteira viva NAO MEDIDA::Bypass(a,P) exige RULESET_READ_TOKEN; exit 2 = NOT_VERIFIED"
            exit 2
          fi
          python3 evidence/probes/github-ruleset.py \
            --owner "${GITHUB_REPOSITORY%%/*}" \
            --repo  "${GITHUB_REPOSITORY##*/}" \
            --branch main \
            --context verify-pr
