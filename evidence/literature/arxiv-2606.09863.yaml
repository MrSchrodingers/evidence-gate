# Camada de qualidade de evidencia - ver evidence/validate-literature.py para o contrato e
# para a definicao da escala fechada de inference_strength. Verde no validador e FORMA (campos
# presentes, vocabulario fechado, numero com fonte apontada), NAO fidelidade de conteudo a fonte
# primaria - o validador nao le o artigo. Ver docstring de validate-literature.py.
literature_id: arxiv-2606.09863
citation: >-
  Advani, L. From Confident Closing to Silent Failure: Characterizing False Success in LLM
  Agents. arXiv:2606.09863, pre-print de 2026.
identifier: arXiv:2606.09863
url: https://arxiv.org/abs/2606.09863
cited_in:
# REMOVIDO 2026-09-04: `execution/agents/refutador.md` constava aqui e NAO cita esta fonte
# em lugar nenhum (conferido por busca de identificador, autor e assunto). Era referencia
# FALSA - aquele agente cita Huang et al. (arXiv:2310.01798), nao Advani. Acusada pela
# validacao nova de `cited_in`.
- docs/adr/0010-gate-de-conclusao-ancorado-em-execucao.md (citacao ANTERIOR, corrigida por 0011)
- docs/adr/0011-de-encenacao-a-mecanismo.md (correcao da citacao de 0010)
provenance: preprint
study_quality:
  benchmark: "tau2-bench e AppWorld (fonte: texto completo)."
  n: >-
    9.876 trajetorias de tau2-bench, de 8 familias de modelo; 1.879 trajetorias de AppWorld,
    de 4 familias de modelo, com ground truth independente de texto (fonte: abstract,
    https://arxiv.org/abs/2606.09863, conferido nesta sessao).
  models: >-
    O abstract identifica a origem das trajetorias avaliadas como 8 familias de modelo
    (tau2-bench) e 4 familias de modelo (AppWorld), sem nomear as familias (fonte: abstract).
    A avaliacao de falso sucesso usa 5 juizes LLM com 5 estrategias de prompt (fonte:
    abstract); a identidade especifica desses 5 juizes nao esta no abstract - [nao verificado]
    nesta camada.
  scaffold: >-
    Os dois benchmarks (fonte - study_quality.benchmark acima) sao de agente
    conversacional/single-dual-control e de execucao de tarefas em app; nenhum dos dois e
    Claude Code nem Codex.
  oracle: >-
    AUROC de juizes LLM na deteccao de falso sucesso, comparado contra detectores leves
    (fonte: texto completo). O detector leve e TF-IDF + XGBoost, nao TF-IDF sozinho (fonte:
    texto completo, legenda da Table 6, conferido no HTML cru nesta sessao).
  baseline: >-
    AUROC dos juizes LLM: no maximo 0.65 em tau2-bench, 0.54 em AppWorld (fonte: texto
    completo). Detectores leves atingem 0.83 (tau2-bench) e 0.95 (AppWorld), acima dos juizes
    LLM e mais rapidos - achado NAO usado hoje por este repositorio (ver limitations).
  trials_repeated: >-
    Sim, para a avaliacao task-disjoint: "GroupShuffleSplit over task_id, ensuring no task
    appears in both train and test, averaged over 5 random seeds" (fonte: texto completo,
    secao de protocolo de avaliacao, string conferida no HTML cru nesta sessao). Os autores a
    chamam de "our cleanest generalization evaluation". Nao verificado se as demais condicoes
    (LODO, in-domain) repetem sementes.
  uncertainty_reported: "[nao verificado] - nao confirmado na leitura."
  code_data_available: "[nao verificado] - nao confirmado na leitura."
  replicated: false
applicability:
  domain_similarity: >-
    Alta - o fenomeno medido (agente declara sucesso quando o resultado real falha) e
    exatamente o que motiva o gate de conclusao ancorado em execucao (fonte - ver cited_in
    acima) e a regra "pronto nasce de execucao, nunca de auto-avaliacao" deste repositorio.
  scaffold_similarity: >-
    Baixa - os dois benchmarks do estudo (fonte - study_quality.benchmark acima) sao de
    agente conversacional/tool-use, nao Claude Code nem Codex; o mecanismo generaliza melhor
    que o numero especifico.
  oracle_similarity: >-
    Media - o estudo usa AUROC de deteccao de falso sucesso como oraculo, nao verificacao
    executavel direta do artefato; este repositorio usa exit code de comando como oraculo, um
    principio relacionado mas nao identico.
inference_strength: SUPPORTED
inference_rationale: >-
  O estudo mede diretamente o fenomeno que motiva a regra dura deste repositorio (nao declarar
  "pronto" sem execucao) em populacao de agente LLM real, com desenho de multiplos juizes e
  multiplas estrategias (fonte - study_quality.models acima). A discrepancia de scaffold (nenhum
  dos benchmarks do estudo e Claude Code/Codex) impede DIRECT, mas a proximidade de mecanismo -
  autoavaliacao de sucesso por um agente LLM sem sinal externo - e alta o bastante para
  SUPPORTED: o estudo sustenta a decisao de desenho (usar exit code como sinal externo em vez
  de a propria narrativa do agente), mesmo sem ser uma avaliacao deste harness especificamente.
  O achado de detectores leves com AUROC mais alto que os juizes LLM (fonte -
  findings.lightweight_detector_auroc_tau2bench e findings.lightweight_detector_auroc_appworld
  acima) e uma oportunidade nao explorada, nao usada por nenhum mecanismo deste repositorio
  hoje - ver limitations.
findings:
- metric: llm_judge_auroc_tau2bench_max
  value: "<=0.65"
  source: fulltext
  note: 5 juizes x 5 estrategias em tau2-bench.
- metric: llm_judge_auroc_appworld
  value: "0.54"
  source: fulltext
- metric: lightweight_detector_auroc_tau2bench
  value: "0.83"
  source: fulltext
  note: nao usado hoje por este repositorio.
- metric: lightweight_detector_auroc_appworld
  value: "0.95"
  source: fulltext
  note: nao usado hoje por este repositorio.
- metric: false_success_rate_tau2_single_control
  value: "45-48%"
  source: fulltext
  note: >-
    NUMERO DO CORPO DO TEXTO (secao 4.1: "45% and 48% of failures in airline and retail
    respectively"), MANTIDO AQUI COMO REGISTRO DO QUE A FONTE DIZ - nao e o valor a citar. A
    Table 1 do mesmo artigo da airline 45% e retail 47%. Ver
    findings.false_success_rate_tau2_single_control_table1 abaixo e a limitacao dedicada:
    o artigo e internamente inconsistente nesta quantidade.
- metric: false_success_rate_tau2_single_control_table1
  value: "airline 45%, retail 47% (sobre 1.730 falhas)"
  source: fulltext
  note: >-
    VALOR A CITAR. Table 1 e a unica apresentacao com as CONTAGENS por dominio, e por isso e a
    apresentacao ancorada em dado e nao em prosa. Conferido em fonte primaria em 2026-09-04
    (https://arxiv.org/html/2606.09863v1) por esta sessao, e independentemente por um contexto
    de busca separado, que chegou aos mesmos 45/47.
- metric: inconsistencia_interna_declarada
  value: "quatro apresentacoes divergentes da mesma quantidade"
  source: fulltext
  note: >-
    Medido em 2026-09-04 sobre a UNICA versao existente (v1, submetida 2026-06-01; historico de
    versoes conferido em https://arxiv.org/abs/2606.09863 - nao ha v2, entao a divergencia NAO e
    entre versoes). Apresentacoes encontradas para a taxa em dominios single-control: Table 1 da
    45 e 47; a secao 4.1 diz "45% and 48%"; o texto corrido cita a faixa "44-52%". Uma leitura da
    pagina /abs devolveu ainda "45--48%" onde a leitura do /html devolveu "44-52%" para a MESMA
    frase do abstract - essa ultima divergencia NAO foi resolvida e fica marcada
    `[nao verificado]`, porque as duas leituras foram feitas pelo mesmo instrumento (WebFetch) e
    nao ha terceira observacao que decida. O que ESTA estabelecido, por duas leituras
    independentes que concordam, e a Table 1 (45/47) e o seu conflito com a secao 4.1 (45/48).
- metric: false_success_rate_tau2_dual_control_telecom
  value: "3%"
  source: fulltext
- metric: false_success_rate_appworld
  value: "75.8%"
  source: fulltext
- metric: judge_surface_proxy_assertion_language_tau2
  value: "+0.27-0.36"
  source: fulltext
  note: >-
    "Trajectories containing assertion vocabulary score 0.27-0.36 points more 'completed'
    regardless of actual outcome" - o juiz ancora em linguagem de asseveracao, nao em mudanca
    de estado verificada. RELEVANTE PARA ESTE REPOSITORIO: evidence/hooks/subagent-contract.sh
    mede uma ANCORA lexical (arquivo:linha, exit code, comando, prompt de shell), que e
    proxy de superficie da mesma classe - ver limitations.
- metric: judge_checklist_helps_gpt4o_hurts_sonnet
  value: "GPT-4o 0.394->0.537; Sonnet 4.5 blind 0.368 -> with-task 0.289 -> checklist 0.274"
  source: fulltext
  note: >-
    Instruir o juiz explicitamente que "GET-only sequences cannot complete write tasks" eleva
    o GPT-4o mas DEGRADA o Sonnet 4.5 monotonicamente conforme se acrescenta contexto. Mais
    instrucao ao juiz nao e monotonicamente melhor.
- metric: detector_ablation_sem_mensagem_final
  value: "AUROC 0.924 (sem a mensagem de fechamento) vs 0.934 (so a mensagem de fechamento)"
  source: fulltext
  note: >-
    "the signal is distributed throughout the trajectory, not concentrated in the labeled
    closing message" - o sinal de falso sucesso esta na trajetoria inteira, nao so na
    declaracao final.
- metric: triagem_recall_a_10pct_flag
  value: "detector 72% [IC95 63-80] vs melhor juiz 13% [8-17]"
  source: fulltext
- metric: triagem_precisao_a_10pct_flag
  value: "50%"
  source: fulltext
  note: >-
    "At a 10% flag rate, precision is 50%: half of flagged trajectories are false alarms." Os
    autores declaram: "The detector is a triage signal, not an autonomous monitor."
- metric: taxonomia_de_falha
  value: "falso sucesso 35.6% (616) / falha honesta 43.5% (753) / ambiguo 20.9% (361)"
  source: fulltext
  note: proporcoes sobre o conjunto de FALHAS de tau2-bench, rotuladas por regex.
- metric: historical_miscitation_corrected
  value: "45-89% (faixa que NAO existe no artigo)"
  source: "docs/adr/0011-de-encenacao-a-mecanismo.md"
  note: >-
    a config global deste operador citou anteriormente "false success 45-89%" para este
    identificador; docs/adr/0011 auditou contra a fonte primaria e corrigiu para as tres
    condicoes acima (45-48% / 3% / 75.8%) - a faixa unica 45-89% nao existe no paper.
limitations:
- Scaffold do estudo (fonte - study_quality.benchmark acima) difere do scaffold deste
  repositorio (Claude Code, Codex); a magnitude dos numeros de AUROC/falso-sucesso pode nao se
  transportar diretamente.
- Identidade dos 5 juizes LLM e das 5 estrategias de deteccao nao verificada nesta camada.
- >-
  FONTE INTERNAMENTE INCONSISTENTE nesta quantidade (fonte -
  findings.inconsistencia_interna_declarada acima). Quem citar deve usar a Table 1 (45/47/3) e
  NUNCA a faixa "44-52%", que nao corresponde a nenhuma contagem apresentada. Isto nao invalida
  o estudo - o desenho e a construcao do ground truth seguem solidos -, mas rebaixa a confianca
  em qualquer numero deste artigo que so apareca em prosa.
- >-
  APPWORLD (75.8%) TEM SELECAO FORTE NO DENOMINADOR e nao e taxa populacional: o valor sai apos
  excluir trajetorias sem `status` e apos REMOVER as arquiteturas `react`/`plan_exec`, que o
  proprio artigo descreve como escrevendo `status=success` na conclusao independentemente de a
  tarefa ter sido resolvida - ou seja, as arquiteturas com falso sucesso estrutural de 100%
  foram tiradas do numerador. Reportado por contexto de busca separado em 2026-09-04 e NAO
  reconferido em fonte primaria por esta sessao: tratar como `[nao verificado]` ate que seja.
- >-
  VENUE NAO VERIFICADO. O campo `comment` do arXiv declara "Accepted to FAGEN@ICML2026", mas
  esse campo e preenchido pelo proprio autor e nao foi conferido contra listagem de ICML nem
  contra OpenReview. Tratar como PRE-PRINT (o que `provenance` ja registra) e nao como trabalho
  aceito em workshop revisado.
- Taxa de falso sucesso varia por condicao experimental de forma ampla (3% a 75.8%, fonte -
  findings acima); citar um unico numero fora do contexto da condicao repete o defeito que
  docs/adr/0011 corrigiu.
- O achado de detectores leves superando juizes LLM em AUROC nao esta implementado por nenhum
  mecanismo deste repositorio hoje; citar esse achado como justificativa para uma capacidade
  ainda inexistente seria SPECULATIVE, nao SUPPORTED - por isso ele fica registrado como
  finding, e nao como parte do inference_rationale.
- O detector NAO e portao. Os proprios autores o escopam como triagem ("The detector is a
  triage signal, not an autonomous monitor", fonte - findings.triagem_precisao_a_10pct_flag
  acima), com precisao 50% a 10% de flag rate. Citar 0.83/0.95 sem esse limite reproduz a
  citacao seletiva que docs/adr/0011 corrigiu neste mesmo identificador.
- APLICABILIDADE AO subagent-contract.sh, registrada como observacao NAO MEDIDA. O hook mede
  presenca de ancora lexical (evidence/hooks/subagent-contract.sh, bloco ORACULO DA ANCORA);
  o estudo mede que juizes ancorados em linguagem de asseveracao erram de forma sistematica
  (fonte - findings.judge_surface_proxy_assertion_language_tau2 acima). A analogia e de
  MECANISMO, nao de medicao - ninguem mediu a taxa de falso sucesso que o hook deixa passar
  neste harness. Enquanto nao houver essa medicao, a afirmacao "o hook e um detector de proxy
  de superficie" e HIPOTESE sustentada por analogia, e o estimando correto para esse uso
  especifico e EXTRAPOLATED, nao o SUPPORTED do campo inference_strength - que se refere
  apenas a decisao de usar exit code como sinal externo.
- Construir aqui o analogo do detector de AppWorld (vetorizar a sequencia de tool-calls do
  subagente) NAO e viavel sobre historico - medido e verificado nesta sessao (fonte - execucao direta sobre o log), de 1200 registros de
  ~/.claude/logs/subagent-probe.jsonl com agent_transcript_path, apenas 35 (2%) ainda tinham o
  transcript em disco, e 1165 de 1200 tinham agent_type vazio. O log do probe guarda ponteiro
  e mensagem final, nao a sequencia de ferramentas. Capturar a sequencia exigiria extrai-la no
  proprio SubagentStop, antes da coleta do transcript - trabalho futuro, nao capacidade atual.
