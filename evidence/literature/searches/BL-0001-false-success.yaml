result:
  matching_studies: 7
  matches:
    - id: arXiv:2606.09863
      ledger: evidence/literature/arxiv-2606.09863.yaml
      direction: "A - P(declara sucesso | verificador reprova)"
      why: >
        Advani (autor unico). Ground truth = reward programatica do tau2-bench e campo `status`
        do banco do supervisor no AppWorld, sem dependencia do texto do agente. Denominador = o
        conjunto de FALHAS. Metadados reconferidos em fonte primaria NESTA sessao. Table 1:
        airline 45%, retail 47%, telecom (dual-control) 3%, sobre 1.730 falhas de 9.876 tarefas.
    - id: arXiv:2605.08747
      direction: "A"
      why: >
        VIGIL. Reporta `P(rep | W=0)` - taxa de relatorio condicionada a falha de estado de mundo
        oculto - por modelo, n=1.000 episodios. NAO reconferido em fonte primaria nesta sessao.
    - id: arXiv:2606.05238
      direction: "A e B"
      why: >
        DeployBench. "60 report SUCCESS while failing verification" em 102 self-stops.
        NAO reconferido em fonte primaria nesta sessao.
    - id: arXiv:2604.11270
      direction: "A"
      why: >
        AnalysisBench. Contrapoe taxa auto-validada e taxa verificada manualmente por agente e
        modelo (ex.: 100% declarado vs 20% verificado). NAO reconferido nesta sessao.
    - id: arXiv:2606.11688
      direction: "A"
      why: >
        Goal-Autopilot. Taxa de claim terminal sem gate falsificavel aprovado, com IC95, em
        corpus pareado de 3.150 celulas. NAO reconferido nesta sessao.
    - id: arXiv:2605.29054
      direction: "A"
      why: >
        T2J-Bench. Gap entre pass rate auto-julgado (>90%) e medido por avaliador fixo (0-29%),
        n=355. NAO reconferido nesta sessao.
    - id: arXiv:2410.15164
      direction: "B - P(verificador reprova | declarou completude)"
      why: >
        SPA-Bench, ICLR 2025 Spotlight - o UNICO da lista com venue de conferencia principal.
        "Premature termination signal" e literalmente o condicional inverso. NAO reconferido.
conclusion: >
  A afirmacao de ausencia e FALSA, e agora por busca EXTERNA e nao apenas contra o corpus
  interno: sete estudos medem o condicional, em alguma das duas direcoes. O ADR 0033 ja havia
  recebido errata por este motivo. O que permanece sem evidencia e outra proposicao, que NAO e
  de ausencia na literatura: nao ha demonstracao causal pareada de que ESTE aparato reduza
  aquele desfecho contra um baseline equivalente - e a busca confirma que nenhum dos sete mede
  a INTERVENCAO (um verificador externo na alca de retorno do agente, bloqueando a parada).
limits:
  - >
    OS NUMEROS NAO SAO COMPARAVEIS ENTRE SI e nao formam uma faixa de um mesmo estimando.
    Denominadores diferentes (falhas, episodios, claims, runs), direcoes diferentes (A e B) e
    verificadores diferentes (reward programatica, estado de mundo oculto, teste manual, gate
    falsificavel, pipeline oculto). Qualquer citacao precisa carregar o denominador junto.
  - >
    BASE DE EVIDENCIA JOVEM. Seis dos sete sao pre-prints de 2026 sem venue confirmado; dois tem
    autor unico. O unico com venue de conferencia principal (arXiv:2410.15164, ICLR 2025
    Spotlight) e o mais antigo e mede a direcao INVERSA.
  - >
    COBERTURA INCOMPLETA, declarada: Semantic Scholar NAO foi consultada (HTTP 429 em todas as
    tentativas, sem API key). ACL Anthology nao e buscavel programaticamente e a busca aberta
    direcionada nao devolveu hits no dominio. No OpenReview a busca funcionou mas a leitura de
    nota foi bloqueada por challenge 403 - um titulo potencialmente relevante (forum AWc2cd9p40,
    RSS 2026 L2P Workshop) ficou SEM autores e SEM numeros, e nada foi inferido dele.
  - >
    RECONFERENCIA PARCIAL. So arXiv:2606.09863 teve metadados e numeros reconferidos em fonte
    primaria diretamente nesta sessao. Os outros seis vem do contexto delegado com fonte
    declarada e NAO foram reabertos aqui - tratar como `[nao verificado]` ate que sejam.
    Precedente que obriga esta cautela: o ADR 0011 registra que quatro de cinco citacoes deste
    repositorio ja foram falsas sob vigilancia da regra que as proibia, e nesta mesma busca um
    sumarizador devolveu "87 de 97 ... 55 report SUCCESS" onde o HTML primario diz "92 de 102
    ... 60".
  - >
    O termo "false success" com este sentido e recente e ainda nao e vocabulario estabelecido:
    tres consultas ao arXiv e duas ao dblp devolveram ZERO. Uma busca futura com vocabulario
    diferente pode encontrar trabalho que esta nao alcancou.
